<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin | Asset Uplink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Fira Code', monospace; }
        input:focus {
            outline: none;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen selection:bg-blue-500/30 flex flex-col">

<!-- Atmospheric Background -->
<div class="fixed inset-0 z-0 opacity-10" style="background-image: radial-gradient(#374151 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>

<main class="relative z-10 max-w-2xl mx-auto px-6 py-16 w-full">

    <header class="mb-10">
        <div class="text-blue-500 mono text-xs mb-2 tracking-widest uppercase font-bold">// ASSET_REPOSITORY_UPLINK</div>
        <h1 class="text-3xl font-bold text-white tracking-tight">Upload Image Asset</h1>
        <p class="text-gray-500 text-sm mt-2">Upload files here to generate a reference URL for blog HTML usage.</p>
    </header>

    <form th:action="@{/blog/image-upload/process}" method="post" enctype="multipart/form-data"
          class="space-y-8 bg-gray-900/50 backdrop-blur-md border border-gray-800 p-8 rounded-2xl shadow-2xl">

        <!-- File Selection -->
        <div class="space-y-4">
            <label for="file" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Select Source File</label>
            <div class="relative group">
                <input type="file" id="file" name="file" required
                       class="w-full text-sm text-gray-400
                                  file:mr-4 file:py-3 file:px-6
                                  file:rounded-xl file:border-0
                                  file:text-xs file:font-bold file:uppercase file:tracking-widest
                                  file:bg-blue-600 file:text-white
                                  hover:file:bg-blue-500 transition-all cursor-pointer
                                  bg-gray-800/50 border border-gray-700 p-2 rounded-xl">
            </div>
            <p class="text-[10px] text-gray-600 mono uppercase tracking-tight">Supported: JPG, PNG, WEBP, GIF</p>
        </div>

        <!-- Security Code -->
        <div class="space-y-2">
            <label for="code" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Authorization Token</label>
            <input type="password" id="code" name="code" required
                   class="w-full bg-gray-800/50 border border-gray-700 p-4 rounded-xl text-white placeholder-gray-600 transition-all"
                   placeholder="Enter security code...">
        </div>

        <!-- Action Button -->
        <div class="pt-4">
            <button type="submit"
                    class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold uppercase tracking-[0.2em] rounded-xl transition-all shadow-lg shadow-blue-600/10 active:scale-[0.98]">
                Push to Repository
            </button>
        </div>
    </form>

    <!-- NAVIGATION FOOTER MODIFIED HERE -->
    <div class="mt-8 flex flex-col gap-3 px-2">
        <div class="flex justify-between items-center">
            <a th:href="@{/blog/upload}" class="text-gray-600 hover:text-blue-400 transition-colors text-[10px] mono uppercase tracking-widest">
                [ Go to Blog Editor ]
            </a>
            <a th:href="@{/blog/image-upload/view}" class="text-gray-600 hover:text-blue-400 transition-colors text-[10px] mono uppercase tracking-widest">
                [ View Asset Gallery ]
            </a>
        </div>
        <div class="text-center">
            <a th:href="@{/blog}" class="text-gray-600 hover:text-white transition-colors text-[10px] mono uppercase tracking-widest">
                [ Back to Index ]
            </a>
        </div>
    </div>

</main>

<footer class="mt-auto pb-12 text-center opacity-30">
    <p class="text-gray-600 mono text-[10px] uppercase tracking-[0.3em]">System v2.0 // Node: Bota, Perak</p>
</footer>

</body>
</html>
