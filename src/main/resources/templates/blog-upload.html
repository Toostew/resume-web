<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiman Haziq | Upload Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }

        /* Styled File Inputs */
        input[type="file"]::file-selector-button {
            background: #1f2937;
            color: #9ca3af;
            border: 1px solid #374151;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            margin-right: 1rem;
            transition: all 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            background: #374151;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen relative overflow-x-hidden flex flex-col">

<!-- Atmospheric Background Components -->
<div class="fixed inset-0 z-0 opacity-20" style="background-image: radial-gradient(#374151 0.5px, transparent 0.5px); background-size: 32px 32px;"></div>
<div class="fixed -top-24 -left-24 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px] z-0"></div>
<div class="fixed bottom-0 -right-24 w-80 h-80 bg-cyan-600/10 rounded-full blur-[100px] z-0"></div>

<main class="relative z-10 max-w-4xl mx-auto px-6 py-16 w-full">

    <header class="mb-12">
        <a href="/blog" class="inline-flex items-center text-gray-500 hover:text-blue-400 transition-colors text-sm font-medium mb-6 group">
            <svg class="w-4 h-4 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Back to Blog
        </a>
        <h1 class="text-3xl font-bold text-white tracking-tight">Compose Post</h1>
        <p class="text-gray-400 mt-2 font-mono text-sm uppercase tracking-wider">Direct Markdown Injection</p>
    </header>

    <form th:action="@{/blog/upload/process}" method="POST" enctype="multipart/form-data" class="bg-gray-800/40 backdrop-blur-md border border-gray-700 p-8 md:p-10 rounded-2xl shadow-2xl space-y-8">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Title -->
            <div>
                <label for="title" class="block text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Blog Title</label>
                <input type="text" id="title" name="title" required
                       placeholder="e.g. Bare-metal STM32 Drivers"
                       class="w-full bg-gray-900/50 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder:text-gray-600 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <!-- Thumbnail -->
            <div>
                <label class="block text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Thumbnail Image</label>
                <input type="file" id="thumbnail" name="thumbnail" accept="image/*" required
                       class="w-full text-sm text-gray-400 mt-2">
            </div>
        </div>

        <!-- Description -->
        <div>
            <label for="description" class="block text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Front-page Summary</label>
            <textarea id="description" name="description" rows="2" required
                      placeholder="A quick hook for the island card..."
                      class="w-full bg-gray-900/50 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder:text-gray-600 focus:outline-none focus:border-blue-500 transition-colors resize-none"></textarea>
        </div>

        <!-- Markdown Raw Text Area -->
        <div>
            <label for="blogMD" class="block text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Markdown Content</label>
            <textarea id="blogMD" name="blogMD" rows="15" required
                      placeholder="# Write your markdown here..."
                      class="w-full bg-gray-900/50 border border-gray-700 rounded-xl px-4 py-3 text-gray-200 font-mono text-sm placeholder:text-gray-600 focus:outline-none focus:border-blue-500 transition-colors"></textarea>
        </div>

        <!-- Authorization Code -->
        <div class="pt-6 border-t border-gray-700">
            <label for="code" class="block text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">Authorization Code</label>
            <input type="password" id="code" name="code" required
                   placeholder="Verification Required"
                   class="w-full bg-gray-900/50 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 transition-colors">
        </div>

        <button type="submit"
                class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all shadow-lg shadow-blue-600/20">
            Commit to Database
        </button>
    </form>
</main>

</body>
</html>
