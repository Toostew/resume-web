<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin | Upload Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Fira Code', monospace; }
        .hidden-section { display: none; }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen selection:bg-blue-500/30 flex flex-col">

<div class="fixed inset-0 z-0 opacity-10" style="background-image: radial-gradient(#374151 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>

<main class="relative z-10 max-w-3xl mx-auto px-6 py-12 w-full">

    <header class="mb-10 flex justify-between items-end">
        <div>
            <div class="text-blue-500 mono text-xs mb-2 tracking-widest uppercase font-bold">// UPLOAD_NEW_ENTRY</div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Post Configuration</h1>
        </div>
        <a th:href="@{/blog}" class="text-gray-500 hover:text-white transition-colors text-xs mono uppercase tracking-tighter">[ Cancel_Exit ]</a>
    </header>

    <form id="uploadForm" th:action="@{/blog/upload/process}" method="post" enctype="multipart/form-data" class="space-y-8 bg-gray-900/50 backdrop-blur-md border border-gray-800 p-8 rounded-2xl shadow-2xl">

        <!-- Post Type Selection -->
        <div class="space-y-3">
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Entry Mode</label>
            <div class="grid grid-cols-2 gap-4">
                <label class="relative flex items-center justify-center p-4 border border-gray-700 rounded-xl cursor-pointer hover:bg-gray-800 transition-all group">
                    <input type="radio" name="PostType" value="post" checked class="hidden peer">
                    <div class="absolute inset-0 border-2 border-transparent peer-checked:border-blue-500 rounded-xl transition-all"></div>
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-gray-500 peer-checked:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        <span class="text-sm font-semibold uppercase tracking-wider group-hover:text-white">Blog Post</span>
                    </div>
                </label>

                <label class="relative flex items-center justify-center p-4 border border-gray-700 rounded-xl cursor-pointer hover:bg-gray-800 transition-all group">
                    <input type="radio" name="PostType" value="image" class="hidden peer">
                    <div class="absolute inset-0 border-2 border-transparent peer-checked:border-blue-500 rounded-xl transition-all"></div>
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-gray-500 peer-checked:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span class="text-sm font-semibold uppercase tracking-wider group-hover:text-white">Image Showcase</span>
                    </div>
                </label>
            </div>
        </div>

        <!-- Metadata -->
        <div class="grid grid-cols-1 gap-6">
            <div class="space-y-2">
                <label for="title" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Title</label>
                <input type="text" id="title" name="title" required
                       class="w-full bg-gray-800/50 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-600 transition-all"
                       placeholder="Enter post identifier...">
            </div>

            <div class="space-y-2">
                <label for="description" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Short Description / Caption</label>
                <textarea id="description" name="description" rows="2" required
                          class="w-full bg-gray-800/50 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-600 transition-all"
                          placeholder="Brief abstract or image caption..."></textarea>
            </div>
        </div>

        <!-- Content Area (Markdown) - To be toggled -->
        <div id="contentSection" class="space-y-2">
            <label for="blogMD" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Content (Markdown)</label>
            <textarea id="blogMD" name="blogMD" rows="12"
                      class="w-full bg-gray-800/50 border border-gray-700 p-4 rounded-lg text-gray-300 placeholder-gray-600 mono text-sm transition-all"
                      placeholder="# Start writing here..."></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Thumbnail Area - Always Visible Now -->
            <div class="space-y-2">
                <label for="thumbnail" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Thumbnail / Display Image</label>
                <input type="file" id="thumbnail" name="thumbnail" required
                       class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-600/10 file:text-blue-400 hover:file:bg-blue-600/20 transition-all cursor-pointer">
            </div>

            <!-- Always Visible -->
            <div class="space-y-2">
                <label for="code" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Service Auth Code</label>
                <input type="password" id="code" name="code" required
                       class="w-full bg-gray-800/50 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-600 transition-all"
                       placeholder="Enter access token...">
            </div>
        </div>

        <div class="pt-6 border-t border-gray-800">
            <button type="submit"
                    class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold uppercase tracking-[0.2em] rounded-xl transition-all shadow-lg active:scale-[0.98]">
                Push to Production
            </button>
        </div>
    </form>

    <!-- NAVIGATION FOOTER ADDED HERE -->
    <div class="mt-8 flex justify-between items-center px-2">
        <a th:href="@{/blog/image-upload}" class="text-gray-600 hover:text-blue-400 transition-colors text-[10px] mono uppercase tracking-widest">
            [ Go to Image Uplink ]
        </a>
        <a th:href="@{/blog}" class="text-gray-600 hover:text-white transition-colors text-[10px] mono uppercase tracking-widest">
            [ Back to Index ]
        </a>
    </div>

</main>

<script>
    const postTypeRadios = document.querySelectorAll('input[name="PostType"]');
    const contentSection = document.getElementById('contentSection');
    const markdownArea = document.getElementById('blogMD');

    function toggleInputs() {
        const selectedType = document.querySelector('input[name="PostType"]:checked').value;

        if (selectedType === 'image') {
            contentSection.classList.add('hidden-section');
            markdownArea.required = false;
            markdownArea.value = "-";
        } else {
            contentSection.classList.remove('hidden-section');
            markdownArea.required = true;
            if(markdownArea.value === "-") markdownArea.value = "";
        }
    }

    postTypeRadios.forEach(radio => radio.addEventListener('change', toggleInputs));
    toggleInputs();
</script>
</body>
</html>
