<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin | Asset Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .asset-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen selection:bg-blue-500/30 flex flex-col">

<!-- Background Decoration -->
<div class="fixed inset-0 z-0 opacity-10" style="background-image: radial-gradient(#374151 0.5px, transparent 0.5px); background-size: 32px 32px;"></div>

<main class="relative z-10 max-w-7xl mx-auto px-6 py-16 w-full">

    <!-- Header -->
    <header class="mb-12 flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div>
            <div class="text-blue-500 mono text-xs mb-2 tracking-widest uppercase font-bold">// ASSET_DATABASE_VIEW</div>
            <h1 class="text-4xl font-bold text-white tracking-tight">Image Repository</h1>
            <p class="text-gray-500 text-sm mt-2">Manage and reference all uploaded site assets.</p>
        </div>
        <div class="flex gap-4">
            <a th:href="@{/blog/image-upload}" class="px-5 py-2.5 bg-gray-900 border border-gray-800 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-gray-800 transition-all mono">
                + Upload New
            </a>
        </div>
    </header>

    <!-- Gallery Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

        <!-- Asset Island -->
        <div th:each="file : ${allFiles}"
             class="asset-card group bg-gray-900/40 backdrop-blur-md border border-gray-800 rounded-2xl overflow-hidden transition-all duration-300 flex flex-col">

            <!-- Preview Section -->
            <div class="aspect-video w-full bg-black relative overflow-hidden border-b border-gray-800">
                <img th:src="@{/blog/render-image/{id}(id=${file.id})}"
                     class="w-full h-full object-contain transition-transform duration-500 group-hover:scale-105"
                     alt="Asset Preview">
                <div class="absolute top-3 right-3 bg-black/60 backdrop-blur-md px-2 py-1 rounded text-[9px] mono text-blue-400 border border-blue-500/30">
                    ID: [[${file.id}]]
                </div>
            </div>

            <!-- Info Section -->
            <div class="p-5 flex-grow flex flex-col">
                <h3 class="text-white font-bold text-sm truncate mb-1" th:text="${file.original_name}">file_name.jpg</h3>

                <div class="space-y-2 mt-4">
                    <div class="flex flex-col">
                        <span class="text-[9px] uppercase tracking-tighter text-gray-500 mono">Date Created</span>
                        <span class="text-xs text-gray-300 mono" th:text="${file.date_created}">2026-05-04</span>
                    </div>

                    <div class="flex flex-col">
                        <span class="text-[9px] uppercase tracking-tighter text-gray-500 mono">Stored Name</span>
                        <span class="text-[10px] text-gray-400 truncate mono" th:text="${file.stored_name}">uuid-string-here.webp</span>
                    </div>
                </div>

                <!-- Copy Button -->
                <div class="mt-6">
                    <button th:onclick="'copyEndpoint(' + ${file.id} + ', this)'"
                            class="w-full py-3 bg-blue-600/10 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/20 rounded-xl text-[10px] font-bold uppercase tracking-widest transition-all mono">
                        Copy Endpoint
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Empty State -->
    <div th:if="${#lists.isEmpty(allFiles)}" class="text-center py-32 border border-dashed border-gray-800 rounded-3xl bg-gray-900/20">
        <p class="text-gray-600 mono italic text-sm">Repository is empty. Awaiting first uplink...</p>
    </div>

</main>

<!-- Success Toast (Hidden by default) -->
<div id="toast" class="fixed bottom-8 right-8 bg-blue-600 text-white px-6 py-3 rounded-xl shadow-2xl translate-y-24 transition-transform duration-300 mono text-xs font-bold z-50">
    ENDPOINT COPIED TO CLIPBOARD
</div>

<script>
    function copyEndpoint(id, button) {
        const endpoint = `/blog/render-image/${id}`;

        // Copy to clipboard
        navigator.clipboard.writeText(endpoint).then(() => {
            // Visual feedback on button
            const originalText = button.innerText;
            button.innerText = "COPIED!";
            button.classList.add("bg-blue-600", "text-white");

            // Show Toast
            const toast = document.getElementById('toast');
            toast.classList.remove('translate-y-24');

            setTimeout(() => {
                button.innerText = originalText;
                button.classList.remove("bg-blue-600", "text-white");
                toast.classList.add('translate-y-24');
            }, 2000);
        });
    }
</script>

</body>
</html>
