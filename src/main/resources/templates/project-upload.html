<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Admin | Upload Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Fira Code', monospace; }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen selection:bg-blue-500/30 overflow-x-hidden relative flex flex-col">

<!-- Atmospheric background, matched to blog frontend -->
<div class="fixed inset-0 z-0 opacity-20" style="background-image: radial-gradient(#374151 0.5px, transparent 0.5px); background-size: 32px 32px;"></div>
<div class="fixed -top-24 -left-24 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px] z-0"></div>
<div class="fixed top-1/2 -right-24 w-80 h-80 bg-cyan-600/10 rounded-full blur-[100px] z-0"></div>

<main class="relative z-10 max-w-3xl mx-auto px-6 py-16 w-full flex-grow">

    <header class="mb-10 flex justify-between items-end">
        <div>
            <div class="text-blue-500 mono text-xs mb-2 tracking-widest uppercase font-bold">// UPLOAD_NEW_PROJECT</div>
            <h1 class="text-3xl md:text-4xl font-bold text-white tracking-tight">Project Configuration</h1>
        </div>
        <a th:href="@{/projects}" class="text-gray-500 hover:text-white transition-colors text-xs mono uppercase tracking-tighter">Cancel</a>
    </header>

    <form id="uploadForm" th:action="@{/projects/upload/process}" method="post" enctype="multipart/form-data"
          class="space-y-8 bg-gray-800/30 backdrop-blur-sm border border-gray-800 p-8 rounded-2xl shadow-xl">

        <!-- Project Name -->
        <div class="space-y-2">
            <label for="projectName" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Project Name</label>
            <input type="text" id="projectName" name="projectName" required
                   class="w-full bg-gray-900/60 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-600 transition-all"
                   placeholder="Enter project identifier...">
        </div>

        <!-- Description -->
        <div class="space-y-2">
            <label for="description" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Short Description</label>
            <textarea id="description" name="description" rows="2" required
                      class="w-full bg-gray-900/60 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-600 transition-all"
                      placeholder="Brief abstract, shown on project cards..."></textarea>
        </div>

        <!-- Dates + Status -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="space-y-2">
                <label for="startDate" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Start Date</label>
                <input type="date" id="startDate" name="startDate" required
                       class="w-full bg-gray-900/60 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-600 transition-all mono text-sm">
            </div>

            <div class="space-y-2">
                <label for="endDate" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">End Date</label>
                <input type="date" id="endDate" name="endDate"
                       class="w-full bg-gray-900/60 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-600 transition-all mono text-sm">
                <p class="text-[10px] text-gray-600 mono">Leave blank if ongoing</p>
            </div>

            <div class="space-y-2">
                <label for="status" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Status</label>
                <select id="status" name="status" required
                        class="w-full bg-gray-900/60 border border-gray-700 p-3 rounded-lg text-white transition-all mono text-sm appearance-none cursor-pointer">
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="ARCHIVED">Archived</option>
                    <option value="ON_HOLD">On Hold</option>
                </select>
            </div>
        </div>

        <!-- Content (Markdown) -->
        <div class="space-y-2">
            <label for="content" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Content (Markdown)</label>
            <textarea id="content" name="content" rows="12" required
                      class="w-full bg-gray-900/60 border border-gray-700 p-4 rounded-lg text-gray-300 placeholder-gray-600 mono text-sm transition-all"
                      placeholder="# Start writing here..."></textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Thumbnail -->
            <div class="space-y-2">
                <label for="thumbnail" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Thumbnail / Display Image</label>
                <input type="file" id="thumbnail" name="thumbnail" required
                       class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-600/10 file:text-blue-400 hover:file:bg-blue-600/20 transition-all cursor-pointer">
            </div>

            <!-- Auth Code -->
            <div class="space-y-2">
                <label for="code" class="block text-xs font-bold text-gray-500 uppercase tracking-widest mono">Service Auth Code</label>
                <input type="password" id="code" name="code" required
                       class="w-full bg-gray-900/60 border border-gray-700 p-3 rounded-lg text-white placeholder-gray-600 transition-all"
                       placeholder="Enter access token...">
            </div>
        </div>

        <div class="pt-6 border-t border-gray-800">
            <button type="submit"
                    class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold uppercase tracking-[0.2em] rounded-xl transition-all shadow-lg active:scale-[0.98]">
                Push to Production
            </button>
        </div>
    </form>

    <div class="mt-8 flex justify-between items-center px-2">
        <a th:href="@{/blog/upload}" class="text-gray-600 hover:text-blue-400 transition-colors text-[10px] mono uppercase tracking-widest">
            [ Go to Blog Upload ]
        </a>
        <a th:href="@{/projects}" class="text-gray-600 hover:text-white transition-colors text-[10px] mono uppercase tracking-widest">
            [ Back to Index ]
        </a>
    </div>

</main>

</body>
</html>
