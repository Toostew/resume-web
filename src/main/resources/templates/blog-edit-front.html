<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Manager | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen selection:bg-blue-500/30 relative flex flex-col">

<!-- Background FX -->
<div class="fixed inset-0 z-0 opacity-20" style="background-image: radial-gradient(#374151 0.5px, transparent 0.5px); background-size: 32px 32px;"></div>
<div class="fixed -top-24 -left-24 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px] z-0"></div>
<div class="fixed top-1/2 -right-24 w-80 h-80 bg-cyan-600/10 rounded-full blur-[100px] z-0"></div>

<main class="relative z-10 max-w-6xl mx-auto px-6 py-12 flex-grow w-full">

    <!-- Top Navigation & Dashboard Header -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-10 pb-6 border-b border-gray-800/80">
        <div>
            <a href="/blog" class="inline-flex items-center text-gray-500 hover:text-blue-400 transition-colors text-sm font-medium group mb-3">
                <svg class="w-4 h-4 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                View Public Blog
            </a>
            <div class="flex items-center gap-3">
                <h1 class="text-3xl font-bold tracking-tight text-white">Post Manager</h1>
                <span class="text-xs font-mono px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20"
                      th:text="${numberOfPosts} + ' Posts'">
                    0 Posts
                </span>
            </div>
            <p class="text-gray-400 text-sm mt-1">Select any blog post card below to edit its attributes and content.</p>
        </div>

        <div class="flex items-center gap-3">
            <a href="/blog/create" class="inline-flex items-center px-4 py-2.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-500 rounded-lg transition-colors shadow-lg shadow-blue-600/20">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Create New Post
            </a>
        </div>
    </header>

    <!-- Empty State (Shows if no posts exist) -->
    <div th:if="${#lists.isEmpty(ListOfAllPosts)}" class="text-center py-20 bg-gray-950/40 border border-gray-800 rounded-xl">
        <svg class="w-12 h-12 mx-auto text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
        <p class="text-gray-400 font-mono text-sm">No blog posts found in database.</p>
        <a href="/blog/create" class="inline-block mt-4 text-xs text-blue-400 hover:underline font-mono">Create your first post &rarr;</a>
    </div>

    <!-- Posts Grid -->
    <div th:unless="${#lists.isEmpty(ListOfAllPosts)}" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <div th:each="post : ${ListOfAllPosts}" class="h-full">
            <a th:href="@{'/blog/edit/' + ${post.id}}" 
               class="group block h-full bg-gray-950/40 border border-gray-800/80 hover:border-blue-500/50 hover:bg-gray-950/80 rounded-xl p-5 transition-all duration-200 hover:-translate-y-1 flex flex-col justify-between relative overflow-hidden">
                
                <!-- Card Header / ID & Type -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-mono text-gray-500">
                            ID: <span class="text-blue-400 font-semibold" th:text="${'#' + post.id}">#1</span>
                        </span>
                        
                        <!-- Dynamic Post Type Badge -->
                        <span th:text="${#strings.toUpperCase(post.ptype)}"
                              th:class="${post.ptype == 'art' ? 'bg-purple-500/10 text-purple-400 border-purple-500/20' : 'bg-blue-500/10 text-blue-400 border-blue-500/20'}"
                              class="text-[10px] font-mono px-2 py-0.5 rounded border uppercase tracking-wider">
                            POST
                        </span>
                    </div>

                    <!-- Post Title -->
                    <h2 class="text-lg font-bold text-white group-hover:text-blue-400 transition-colors line-clamp-2 mb-2"
                        th:text="${post.title}">
                        Sample Post Title
                    </h2>

                    <!-- Slug -->
                    <p class="text-[11px] font-mono text-gray-500 truncate mb-3">
                        /<span th:text="${post.titleURLFriendly}">sample-post-title</span>
                    </p>

                    <!-- Snippet Description -->
                    <p class="text-xs text-gray-400 line-clamp-3 leading-relaxed mb-4"
                       th:text="${post.description != null && !post.description.isEmpty() ? post.description : 'No description provided.'}">
                        Short post snippet description goes here...
                    </p>
                </div>

                <!-- Card Footer / Date & Edit Button -->
                <div class="pt-4 border-t border-gray-800/60 flex items-center justify-between mt-auto">
                    <span class="text-[11px] font-mono text-gray-500" th:text="${post.uploadDate}">
                        2026-07-26
                    </span>

                    <span class="inline-flex items-center text-xs font-medium text-blue-400 group-hover:translate-x-1 transition-transform">
                        Edit
                        <svg class="w-3.5 h-3.5 ml-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l7-7m7-7H3"></path>
                        </svg>
                    </span>
                </div>

            </a>
        </div>

    </div>

</main>

</body>
</html>
